<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Trendza</title>
    <meta name="description" content="Your Personal Style Assistant" />
    <meta name="author" content="Lovable" />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- CRITICAL: Preload essential resources -->
    <link rel="preload" href="/src/main.tsx" as="script" crossorigin="anonymous">
    
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="//jjqwhxamjxsiotnhhqco.supabase.co">
    <link rel="dns-prefetch" href="//api.studio.nebius.com">
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Clean base styles -->
    <style>
      /* Reset and base styles */
      html, body {
        margin: 0;
        padding: 0;
        background: white;
        color: black;
        overflow-x: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* App shell skeleton */
      .app-shell {
        min-height: 100vh;
        min-height: 100dvh;
        background: white;
        opacity: 0;
        transition: opacity 0.6s ease-in;
      }

      .app-shell.ready {
        opacity: 1;
      }

      /* Performance optimizations */
      .gpu-accelerated {
        transform: translateZ(0);
        -webkit-transform: translateZ(0);
        will-change: transform, opacity;
      }
    </style>
  </head>

  <body>
    <div id="root">


      <!-- App Shell (hidden initially) -->
      <div class="app-shell" id="app-shell">
        <!-- React app will mount here -->
      </div>
    </div>

    <!-- Performance monitoring -->
    <script>
      // Performance timing
      window.APP_PERFORMANCE = {
        startTime: performance.now(),
        metrics: {},
        mark: function(label) {
          this.metrics[label] = performance.now() - this.startTime;
          console.log(`📊 ${label}: ${this.metrics[label].toFixed(2)}ms`);
        }
      };
      
      window.APP_PERFORMANCE.mark('html-parsed');
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
