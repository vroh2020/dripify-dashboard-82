<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>OutfitGrader AI</title>
    <meta name="description" content="AI-Powered Style Analysis & Recommendations" />
    <meta name="author" content="Lovable" />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- CRITICAL: Preload essential resources -->
    <link rel="preload" href="/src/main.tsx" as="script" crossorigin="anonymous">
    
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="//jjqwhxamjxsiotnhhqco.supabase.co">
    <link rel="dns-prefetch" href="//api.studio.nebius.com">
    
    <style>
      /* Reset and base styles */
      html, body {
        margin: 0;
        padding: 0;
        background: white;
        color: black;
        overflow-x: hidden;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- App Shell -->
      <div id="app-shell">
        <!-- React app will mount here -->
      </div>
    </div>

    <!-- Performance monitoring -->
    <script>
      // Performance timing
      window.APP_PERFORMANCE = {
        startTime: performance.now(),
        metrics: {},
        mark: function(label) {
          this.metrics[label] = performance.now() - this.startTime;
          console.log(`📊 ${label}: ${this.metrics[label].toFixed(2)}ms`);
        }
      };
      
      window.APP_PERFORMANCE.mark('html-parsed');
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
