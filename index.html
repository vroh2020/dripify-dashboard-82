<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Drip Max</title>
    <meta name="description" content="AI-Powered Style Analysis & Recommendations" />
    
    <!-- Simple, working splash screen styles -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #1A1F2C;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      
      #root {
        min-height: 100vh;
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }
      
      #root.app-ready {
        opacity: 1;
      }
      
      /* Simple splash screen */
      #html-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #1A1F2C;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        transition: opacity 0.8s ease-out;
      }

      #html-splash.fade-out {
        opacity: 0;
      }

      .splash-content {
        text-align: center;
        color: white;
      }

      .logo {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #f97316, #ea580c);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
      }

      .logo-text {
        font-size: 24px;
        font-weight: 900;
        color: white;
      }

      .app-title {
        font-size: 28px;
        font-weight: 800;
        margin: 20px 0 10px 0;
        color: #f97316;
      }

      .loading-message {
        font-size: 14px;
        color: #888;
        margin: 20px 0;
      }

      .progress-container {
        width: 200px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        margin: 20px auto;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: #f97316;
        width: 0%;
        transition: width 0.3s ease;
      }
    </style>
  </head>
  <body>
    <!-- Simple HTML splash screen -->
    <div id="html-splash">
      <div class="splash-content">
        <div class="logo">
          <div class="logo-text">D</div>
        </div>
        <h1 class="app-title">DripMax</h1>
        <div id="loading-message" class="loading-message">Starting...</div>
        <div class="progress-container">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- React app container -->
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
