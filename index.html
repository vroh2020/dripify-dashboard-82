<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>DripMax</title>
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #1A1F2C;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        height: 100%;
      }
      
      #root {
        min-height: 100vh;
        opacity: 0;
        transition: opacity 0.5s ease;
        background: #1A1F2C;
      }
      
      #root.app-ready {
        opacity: 1;
      }
      
      /* Ultra-simple splash */
      #html-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #1A1F2C;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        transition: opacity 0.3s ease;
      }

      .splash-content {
        text-align: center;
        color: white;
      }

      .logo {
        width: 60px;
        height: 60px;
        background: #f97316;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 15px;
        font-size: 20px;
        font-weight: 900;
      }

      .app-title {
        font-size: 24px;
        font-weight: 700;
        color: #f97316;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- Simple splash screen -->
    <div id="html-splash">
      <div class="splash-content">
        <div class="logo">D</div>
        <h1 class="app-title">DripMax</h1>
      </div>
    </div>

    <!-- React app container -->
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
